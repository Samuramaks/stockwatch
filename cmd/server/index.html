<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Принтеры и расходники</title>
<style>
:root{
  color-scheme: light dark;
  --bg:#eef1f4; --panel:#ffffff; --ink:#1b2530; --muted:#5b6875; --line:#d5dbe1; --track:#e2e7ec;
  --ok:#1f7a6b; --low:#96590a; --crit:#b3261e; --focus:#2457c5;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171d; --panel:#1a2129; --ink:#e6ebf0; --muted:#97a3af; --line:#2c3640; --track:#2a333d;
    --ok:#4fb5a3; --low:#e0a030; --crit:#ef7b72; --focus:#8fb0ff;
  }
}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1a2129; --ink:#e6ebf0; --muted:#97a3af; --line:#2c3640; --track:#2a333d;
  --ok:#4fb5a3; --low:#e0a030; --crit:#ef7b72; --focus:#8fb0ff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font:16px/1.45 system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-variant-numeric:tabular-nums;
}
.wrap{max-width:980px; margin:0 auto; padding:32px 20px 56px}
header{display:flex; flex-wrap:wrap; gap:16px 24px; justify-content:space-between; align-items:flex-end; margin-bottom:20px}
h1{margin:0 0 6px; font-size:28px; line-height:1.15; letter-spacing:-.01em}
#summary{margin:0; font-size:17px; color:var(--muted); max-width:60ch}
#summary strong{color:var(--ink); font-weight:600}
.tools{display:flex; align-items:center; gap:12px; color:var(--muted); font-size:14px}
button{
  font:inherit; font-size:14px; color:var(--ink); background:var(--panel);
  border:1px solid var(--line); border-radius:6px; padding:8px 14px; cursor:pointer;
}
button:hover{border-color:var(--muted)}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}

#list{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:0 24px}
.row{
  display:grid; grid-template-columns:minmax(170px,1fr) minmax(220px,1.5fr) minmax(150px,.9fr);
  gap:12px 32px; padding:20px 0; border-bottom:1px solid var(--line); align-items:center;
}
.row:last-child{border-bottom:0}
.name{font-size:18px; font-weight:600; line-height:1.25}
.meta{color:var(--muted); font-size:14px}

.level{display:flex; align-items:baseline; gap:10px; margin-bottom:8px}
.pct{font-size:30px; font-weight:700; line-height:1; letter-spacing:-.02em}
.state{font-size:14px; font-weight:600}
.gauge{position:relative; height:10px; border-radius:5px; background:var(--track)}
.fill{position:absolute; inset:0 auto 0 0; border-radius:5px; min-width:4px}
.tick{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--ink); opacity:.55}
.gauge.empty{background:none; border:1px dashed var(--line)}
.polled{margin-top:8px; font-size:13px; color:var(--muted)}

.ok{color:var(--ok)} .low{color:var(--low)} .crit{color:var(--crit)}
.fill.ok{background:var(--ok)} .fill.low{background:var(--low)} .fill.crit{background:var(--crit)}

.stock-main{font-size:22px; font-weight:600; line-height:1.2}
.stock-note{margin-top:4px; font-size:14px; color:var(--muted)}
.stock-note.low{color:var(--low)} .stock-note.crit{color:var(--crit); font-weight:600}
.unknown{color:var(--muted)}

.message{padding:28px 0; color:var(--muted)}
@media (max-width:720px){
  .row{grid-template-columns:1fr}
  #list{padding:0 16px}
}
.btn-primary{background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600}
.tabs{display:flex; gap:4px; margin:0 0 16px; border-bottom:1px solid var(--line)}
.tab{background:none; border:0; border-bottom:3px solid transparent; border-radius:0; padding:10px 14px; color:var(--muted); font-weight:600; font-size:15px}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--ink)}
#stock{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:0 24px}
.srow{display:grid; grid-template-columns:minmax(170px,1.4fr) minmax(140px,1fr) minmax(90px,.6fr) auto; gap:12px 24px; padding:18px 0; border-bottom:1px solid var(--line); align-items:center}
.srow:last-child{border-bottom:0}
.dec{min-width:64px; font-size:16px; font-weight:600}
.inc{font-size:16px; font-weight:600}
.amt{width:84px; padding:8px; font:inherit; font-size:16px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px}
.amt:disabled{opacity:.4}
.dec:disabled,.inc:disabled{opacity:.4; cursor:not-allowed}
.steps{display:flex; gap:8px}
#flash{margin:0 0 12px; min-height:1.4em; font-size:14px; color:var(--muted)}
#flash.err{color:var(--crit)}
dialog{background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:24px; width:min(460px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h2{margin:0 0 16px; font-size:20px}
.field{display:block; margin-bottom:14px; font-size:14px; color:var(--muted)}
.field input{display:block; width:100%; margin-top:4px; padding:9px 10px; font:inherit; font-size:16px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px}
.actions{display:flex; justify-content:flex-end; gap:10px; margin-top:20px}
#formErr,#itemErr{min-height:1.4em; margin:0; font-size:14px; color:var(--crit)}
@media (max-width:720px){.srow{grid-template-columns:1fr 1fr} .steps{grid-column:1/-1; flex-wrap:wrap} #stock{padding:0 16px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Принтеры и расходники</h1>
      <p id="summary">Загружаем данные…</p>
    </div>
    <div class="tools">
      <span id="updated"></span>
      <button id="refresh" type="button">Обновить</button>
      <button id="addBtn" type="button" class="btn-primary">Добавить принтер</button>
      <button id="addItemBtn" type="button" class="btn-primary" hidden>Новый расходник</button>
    </div>
  </header>
  <p id="flash" role="status"></p>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-printers" aria-selected="true" aria-controls="list" type="button">Принтеры</button>
    <button class="tab" role="tab" id="tab-stock" aria-selected="false" aria-controls="stock" type="button">Расходники</button>
  </div>
  <main id="list" aria-live="polite"></main>
  <section id="stock" aria-live="polite" hidden></section>

  <dialog id="addDlg" aria-labelledby="addTitle">
    <form id="addForm" novalidate>
      <h2 id="addTitle">Новый принтер</h2>
      <label class="field">Название<input name="name" autocomplete="off"></label>
      <label class="field">IP-адрес<input name="ip" inputmode="decimal" placeholder="192.168.1.10" autocomplete="off"></label>
      <label class="field">Модель<input name="model" placeholder="ECOSYS M2040dn" autocomplete="off"></label>
      <label class="field">Расположение<input name="location" placeholder="Каб. 12" autocomplete="off"></label>
      <label class="field">SNMP community<input name="snmp_community" placeholder="public" autocomplete="off"></label>
      <label class="field">Картридж (SKU)<input name="cartridge_sku" list="skus" autocomplete="off"></label>
      <datalist id="skus"></datalist>
      <p id="formErr" role="alert"></p>
      <div class="actions">
        <button type="button" id="addCancel">Отмена</button>
        <button type="submit" class="btn-primary" id="addSubmit">Добавить</button>
      </div>
    </form>
  </dialog>

  <dialog id="itemDlg" aria-labelledby="itemTitle">
    <form id="itemForm" novalidate>
      <h2 id="itemTitle">Новый расходник</h2>
      <label class="field">Название<input name="name" placeholder="Картридж TK-1170" autocomplete="off"></label>
      <label class="field">SKU<input name="sku" placeholder="TK-1170" autocomplete="off"></label>
      <label class="field">Сколько сейчас на складе<input name="quantity" type="number" min="0" step="1" placeholder="0"></label>
      <label class="field">Порог «мало» (когда осталось не больше)<input name="threshold" type="number" min="0" step="1" placeholder="0"></label>
      <label class="field">Единица измерения<input name="unit" placeholder="шт" autocomplete="off"></label>
      <p id="itemErr" role="alert"></p>
      <div class="actions">
        <button type="button" id="itemCancel">Отмена</button>
        <button type="submit" class="btn-primary" id="itemSubmit">Добавить</button>
      </div>
    </form>
  </dialog>
</div>

<script>
// Порог «тонер заканчивается», в процентах. Держите равным TONER_THRESHOLD сервера.
const TONER_LOW = 15;
const REFRESH_MS = 60000;
const DEMO = new URLSearchParams(location.search).has('demo');

const $ = (id) => document.getElementById(id);
const pick = (o, ...keys) => {
  for (const k of keys) if (o && o[k] !== undefined && o[k] !== null) return o[k];
  return undefined;
};
const plural = (n, one, few, many) => {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5) return few;
  if (b === 1) return one;
  return many;
};
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v);
  }
  kids.flat().forEach((c) => c && e.append(c));
  return e;
};
const ago = (iso) => {
  const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (min < 1) return 'только что';
  if (min < 60) return `${min} мин назад`;
  const h = Math.round(min / 60);
  if (h < 48) return `${h} ч назад`;
  return `${Math.round(h / 24)} дн назад`;
};

async function fetchJSON(url) {
  const r = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!r.ok) throw new Error(`${url}: ответ ${r.status}`);
  return r.json();
}

let demoCache;
const demoData = () => (demoCache ??= makeDemo());
function makeDemo() {
  const now = Date.now(), m = (x) => new Date(now - x * 60000).toISOString();
  return {
    printers: [
      { id: 1, name: 'Бухгалтерия', location: 'Каб. 12', model: 'ECOSYS M2040dn', ip: '192.168.1.10', cartridge_sku: 'TK-1170', status: { level_pct: 8, last_polled_at: m(12) } },
      { id: 2, name: 'Приёмная', location: 'Каб. 1', model: 'ECOSYS M3540dn', ip: '192.168.1.11', cartridge_sku: 'TK-3130', status: { level_pct: 6, last_polled_at: m(12) } },
      { id: 3, name: 'Отдел кадров', location: 'Каб. 7', model: 'ECOSYS M2040dn', ip: '192.168.1.12', cartridge_sku: 'TK-1170', status: { level_pct: 64, last_polled_at: m(12) } },
      { id: 4, name: 'Склад', location: 'Подвал', model: 'ECOSYS M3540dn', ip: '192.168.1.13', cartridge_sku: 'TK-3130', status: { level_pct: 91, last_polled_at: m(12) } },
      { id: 5, name: 'Новый принтер', location: '', model: 'ECOSYS M2040dn', ip: '192.168.1.14', cartridge_sku: 'TK-9999', status: null },
    ],
    items: [
      { sku: 'TK-1170', name: 'Картридж TK-1170', quantity: 17, unit: 'шт', threshold: 3 },
      { sku: 'TK-3130', name: 'Картридж TK-3130', quantity: 0, unit: 'шт', threshold: 2 },
      { sku: 'TK-5140', name: 'Картридж TK-5140', quantity: 2, unit: 'шт', threshold: 3 },
    ],
  };
}

async function load() {
  try {
    const { printers, items } = DEMO
      ? demoData()
      : { printers: await fetchJSON('/printers'), items: await fetchJSON('/item') };
    render(printers || [], items || []);
    $('updated').textContent = 'Обновлено ' + new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  } catch (err) {
    $('summary').textContent = 'Не удалось загрузить данные.';
    $('list').replaceChildren(el('p', { class: 'message', text:
      `${err.message}. Проверьте, что сервер запущен и страница открыта с его адреса. Чтобы посмотреть макет без сервера, добавьте ?demo к адресу.` }));
  }
}

function normalize(printers, items) {
  const stock = new Map();
  for (const it of items) {
    stock.set(String(pick(it, 'sku', 'SKU')), {
      qty: Number(pick(it, 'quantity', 'Quantity') ?? 0),
      unit: pick(it, 'unit', 'Unit') || '',
      threshold: Number(pick(it, 'threshold', 'Threshold') ?? 0),
    });
  }
  return printers.map((p) => {
    const sku = pick(p, 'cartridge_sku', 'CartridgeSKU') || '';
    const st = pick(p, 'status', 'Status');
    return {
      id: pick(p, 'id', 'ID'),
      name: pick(p, 'name', 'Name') || 'Без названия',
      location: pick(p, 'location', 'Location') || '',
      model: pick(p, 'model', 'Model') || '',
      ip: pick(p, 'ip', 'IP') || '',
      sku,
      level: st ? Number(pick(st, 'level_pct', 'LevelPct')) : null,
      polledAt: st ? pick(st, 'last_polled_at', 'LastPolledAt') : null,
      stock: stock.get(String(sku)) || null,
    };
  });
}

// 0 — тонер на исходе и картриджей нет, 1 — тонер на исходе, 2 — в порядке, 3 — нет данных
const severity = (p) => {
  if (p.level === null) return 3;
  if (p.level <= TONER_LOW) return p.stock && p.stock.qty <= 0 ? 0 : 1;
  return 2;
};

function render(rawPrinters, rawItems) {
  const list = normalize(rawPrinters, rawItems).sort((a, b) =>
    severity(a) - severity(b) || (a.level ?? 101) - (b.level ?? 101) || a.name.localeCompare(b.name, 'ru'));

  const low = list.filter((p) => p.level !== null && p.level <= TONER_LOW);
  const noStock = low.filter((p) => p.stock && p.stock.qty <= 0).length;
  const unpolled = list.filter((p) => p.level === null).length;

  const parts = [];
  if (!list.length) parts.push('Принтеры ещё не добавлены.');
  else if (!low.length) parts.push('Тонер в порядке у всех опрошенных принтеров.');
  else {
    parts.push(`Тонер заканчивается у <strong>${low.length}</strong> ${plural(low.length, 'принтера', 'принтеров', 'принтеров')}.`);
    if (noStock) parts.push(`Для ${noStock} из них нет картриджей на складе.`);
  }
  if (unpolled) parts.push(`Не опрошено: ${unpolled}.`);
  summaries.printers = parts.join(' ');
  renderStock(rawItems);
  showSummary();

  if (!list.length) {
    $('list').replaceChildren(el('p', { class: 'message', text: 'Добавьте принтер через POST /printers, и он появится здесь.' }));
    return;
  }
  $('list').replaceChildren(...list.map(row));
}

function row(p) {
  const sev = severity(p);
  const tone = sev === 0 ? 'crit' : sev === 1 ? 'low' : 'ok';

  const who = el('div', {},
    el('div', { class: 'name', text: p.name }),
    p.location && el('div', { class: 'meta', text: p.location }),
    el('div', { class: 'meta', text: [p.model, p.ip].filter(Boolean).join(', ') }));

  let toner;
  if (p.level === null) {
    toner = el('div', {},
      el('div', { class: 'level' }, el('span', { class: 'state unknown', text: 'Ещё не опрашивался' })),
      el('div', { class: 'gauge empty', role: 'img', 'aria-label': 'Нет данных о тонере' }));
  } else {
    const lvl = Math.max(0, Math.min(100, p.level));
    const word = p.level <= TONER_LOW ? 'Мало' : 'В порядке';
    const fill = el('div', { class: `fill ${tone}` });
    fill.style.width = lvl + '%';
    const tick = el('div', { class: 'tick', title: `Порог: ${TONER_LOW}%` });
    tick.style.left = `calc(${TONER_LOW}% - 1px)`;
    toner = el('div', {},
      el('div', { class: 'level' },
        el('span', { class: `pct ${tone}`, text: `${p.level}%` }),
        el('span', { class: `state ${tone}`, text: word })),
      el('div', { class: 'gauge', role: 'img', 'aria-label': `Тонер ${p.level}%, ${word.toLowerCase()}` }, fill, tick),
      el('div', { class: 'polled', text: `Опрос: ${ago(p.polledAt)}` }));
  }

  let stock;
  if (!p.sku) {
    stock = el('div', {}, el('div', { class: 'stock-main unknown', text: '—' }),
      el('div', { class: 'stock-note', text: 'У принтера не указан картридж' }));
  } else if (!p.stock) {
    stock = el('div', {}, el('div', { class: 'stock-main unknown', text: '—' }),
      el('div', { class: 'stock-note', text: `Картриджа ${p.sku} нет в учёте склада` }));
  } else {
    const q = Math.max(0, p.stock.qty);
    const empty = q === 0, few = !empty && q <= p.stock.threshold;
    const qty = `${q}${p.stock.unit ? ' ' + p.stock.unit : ''}`;
    stock = el('div', {},
      el('div', { class: `stock-main ${empty ? 'crit' : few ? 'low' : ''}`, text: qty }),
      el('div', { class: 'stock-note', text: `На складе, ${p.sku}` }),
      empty && el('div', { class: 'stock-note crit', text: 'Нужна закупка' }),
      few && el('div', { class: 'stock-note low', text: 'Запас на исходе' }));
  }

  return el('article', { class: 'row' }, who, toner, stock);
}

const summaries = { printers: '', stock: '' };
let activeTab = 'printers';
const showSummary = () => { $('summary').innerHTML = summaries[activeTab]; };

function showTab(name) {
  activeTab = name;
  $('list').hidden = name !== 'printers';
  $('stock').hidden = name !== 'stock';
  for (const t of ['printers', 'stock']) $('tab-' + t).setAttribute('aria-selected', String(t === name));
  $('addBtn').hidden = name !== 'printers';
  $('addItemBtn').hidden = name !== 'stock';
  showSummary();
}
$('tab-printers').addEventListener('click', () => showTab('printers'));
$('tab-stock').addEventListener('click', () => showTab('stock'));

let flashTimer;
function flash(msg, isErr) {
  const f = $('flash');
  f.textContent = msg;
  f.className = isErr ? 'err' : '';
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => { f.textContent = ''; }, 6000);
}

async function errText(res) {
  const j = await res.json().catch(() => null);
  return pick(j, 'error', 'message', 'Error', 'Message') || `ответ сервера ${res.status}`;
}

function renderStock(rawItems) {
  const items = rawItems.map((it) => {
    const sku = String(pick(it, 'sku', 'SKU') ?? '');
    return {
      sku,
      name: pick(it, 'name', 'Name') || sku,
      qty: Math.max(0, Number(pick(it, 'quantity', 'Quantity') ?? 0)),
      unit: pick(it, 'unit', 'Unit') || '',
      threshold: Number(pick(it, 'threshold', 'Threshold') ?? 0),
    };
  });
  const rank = (i) => (i.qty === 0 ? 0 : i.qty <= i.threshold ? 1 : 2);
  items.sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name, 'ru'));

  $('skus').replaceChildren(...items.map((i) => el('option', { value: i.sku })));

  const empty = items.filter((i) => rank(i) === 0).length;
  const few = items.filter((i) => rank(i) === 1).length;
  const parts = [`Позиций на складе: <strong>${items.length}</strong>.`];
  if (empty) parts.push(`Закончились: ${empty}.`);
  if (few) parts.push(`Запас на исходе: ${few}.`);
  if (!empty && !few && items.length) parts.push('Запасов достаточно.');
  summaries.stock = parts.join(' ');

  if (!items.length) {
    $('stock').replaceChildren(el('p', { class: 'message', text: 'Склад пуст. Добавьте позицию через POST /item.' }));
    return;
  }
  $('stock').replaceChildren(...items.map(stockRow));
}

function stockRow(i) {
  const r = i.qty === 0 ? 'crit' : i.qty <= i.threshold ? 'low' : '';
  const note = r === 'crit' ? 'Нужна закупка' : r === 'low' ? 'Запас на исходе' : 'В норме';
  const dec = el('button', { type: 'button', class: 'dec', 'aria-label': `Уменьшить остаток «${i.name}» на 1`, text: '−1' });
  const amount = el('input', { type: 'number', class: 'amt', min: '1', step: '1', inputmode: 'numeric', placeholder: 'кол-во', 'aria-label': `Сколько добавить к «${i.name}»` });
  const add = el('button', { type: 'button', class: 'inc', text: 'Добавить' });
  const all = [dec, amount, add];
  if (i.qty === 0) dec.disabled = true;
  dec.addEventListener('click', () => changeQty(i, all, -1));
  const submitAdd = () => {
    const n = Number(amount.value);
    if (!Number.isInteger(n) || n < 1) {
      flash('Укажите, сколько штук добавить: целое число от 1.', true);
      amount.focus();
      return;
    }
    changeQty(i, all, n);
  };
  add.addEventListener('click', submitAdd);
  amount.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitAdd(); });
  const steps = el('div', { class: 'steps' }, dec, amount, add);
  return el('article', { class: 'srow' },
    el('div', {}, el('div', { class: 'name', text: i.name }), el('div', { class: 'meta', text: i.sku })),
    el('div', {},
      el('div', { class: `stock-main ${r}`, text: `${i.qty}${i.unit ? ' ' + i.unit : ''}` }),
      el('div', { class: `stock-note ${r}`, text: note })),
    el('div', { class: 'meta', text: `Порог: ${i.threshold}` }),
    steps);
}

async function changeQty(i, btns, delta) {
  const next = Math.max(0, i.qty + delta);
  btns.forEach((b) => { b.disabled = true; });
  try {
    if (DEMO) {
      const it = demoData().items.find((x) => x.sku === i.sku);
      if (it) it.quantity = next;
    } else {
      const res = await fetch('/item/' + encodeURIComponent(i.sku), {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ quantity: next }),
      });
      if (!res.ok) throw new Error(await errText(res));
    }
    flash(`${i.name}: теперь ${next}${i.unit ? ' ' + i.unit : ''}.`);
    await load();
  } catch (err) {
    btns.forEach((b) => { b.disabled = false; });
    flash(`Не удалось изменить остаток: ${err.message}`, true);
  }
}

const dlg = $('addDlg'), form = $('addForm');
$('addBtn').addEventListener('click', () => {
  form.reset();
  $('formErr').textContent = '';
  dlg.showModal();
  form.querySelector('[name=name]').focus();
});
$('addCancel').addEventListener('click', () => dlg.close());

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form));
  for (const k in data) data[k] = String(data[k]).trim();
  if (!data.name || !data.ip || !data.snmp_community || !data.cartridge_sku) {
    $('formErr').textContent = 'Заполните название, IP, community и картридж.';
    return;
  }
  $('addSubmit').disabled = true;
  try {
    if (DEMO) {
      demoData().printers.push({ id: Date.now(), ...data, status: null });
    } else {
      const res = await fetch('/printers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (!res.ok) throw new Error(await errText(res));
    }
    dlg.close();
    flash(`Принтер «${data.name}» добавлен. Уровень тонера появится после ближайшего опроса.`);
    await load();
  } catch (err) {
    $('formErr').textContent = err.message;
  } finally {
    $('addSubmit').disabled = false;
  }
});

$('refresh').addEventListener('click', load);
load();
const itemDlg = $('itemDlg'), itemForm = $('itemForm');
$('addItemBtn').addEventListener('click', () => {
  itemForm.reset();
  $('itemErr').textContent = '';
  itemDlg.showModal();
  itemForm.querySelector('[name=name]').focus();
});
$('itemCancel').addEventListener('click', () => itemDlg.close());

itemForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(itemForm));
  const name = String(f.name).trim();
  const sku = String(f.sku).trim();
  const unit = String(f.unit).trim() || 'шт';
  const quantity = String(f.quantity).trim() === '' ? 0 : Number(f.quantity);
  const threshold = String(f.threshold).trim() === '' ? 0 : Number(f.threshold);
  if (!name || !sku) { $('itemErr').textContent = 'Укажите название и SKU.'; return; }
  if (![quantity, threshold].every((n) => Number.isInteger(n) && n >= 0)) {
    $('itemErr').textContent = 'Количество и порог должны быть целыми числами от 0.';
    return;
  }
  $('itemSubmit').disabled = true;
  try {
    const body = { name, sku, quantity, threshold, unit };
    if (DEMO) {
      demoData().items.push({ ...body });
    } else {
      const res = await fetch('/item', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error(await errText(res));
    }
    itemDlg.close();
    flash(`Расходник «${name}» добавлен.`);
    await load();
  } catch (err) {
    $('itemErr').textContent = err.message;
  } finally {
    $('itemSubmit').disabled = false;
  }
});

// автообновление не должно стирать число, которое человек ещё не отправил
const busyTyping = () => [...document.querySelectorAll('.amt')].some((a) => a.value !== '');
setInterval(() => { if (!busyTyping()) load(); }, REFRESH_MS);
</script>
</body>
